<text x="660.8" y="112" fill="#7c89b0" class="b" textLength="109.2" lengthAdjust="spacingAndGlyphs"> Information </text>
<text x="770.0" y="112" fill="#344264" textLength="235.2" lengthAdjust="spacingAndGlyphs">───────────────────────────╮</text>
<text x="47.6" y="130" fill="#7c89b0" textLength="42.0" lengthAdjust="spacingAndGlyphs">  ├─ </text>
<text x="89.6" y="130" fill="#cdd6f4" textLength="50.4" lengthAdjust="spacingAndGlyphs">ghcr  </text>
<text x="140.0" y="130" fill="#7c89b0" textLength="42.0" lengthAdjust="spacingAndGlyphs">○ Off</text>
<text x="652.4" y="130" fill="#344264" textLength="8.4" lengthAdjust="spacingAndGlyphs">│</text>
<text x="660.8" y="130" fill="#cdd6f4" textLength="336.0" lengthAdjust="spacingAndGlyphs"> How this host gets the secret. Enter,  </text>
<text x="996.8" y="130" fill="#344264" textLength="8.4" lengthAdjust="spacingAndGlyphs">│</text>
<text x="47.6" y="148" fill="#7c89b0" textLength="42.0" lengthAdjust="spacingAndGlyphs">  └─ </text>
<text x="89.6" y="148" fill="#cdd6f4" textLength="58.8" lengthAdjust="spacingAndGlyphs">nexus  </text>
<text x="148.4" y="148" fill="#9ed88c" textLength="33.6" lengthAdjust="spacingAndGlyphs">● On</text>
<text x="652.4" y="148" fill="#344264" textLength="8.4" lengthAdjust="spacingAndGlyphs">│</text>
<text x="660.8" y="148" fill="#cdd6f4" textLength="336.0" lengthAdjust="spacingAndGlyphs"> then type a variable name such as      </text>
<text x="996.8" y="148" fill="#344264" textLength="8.4" lengthAdjust="spacingAndGlyphs">│</text>
<text x="47.6" y="166" fill="#74b2ff" class="b" textLength="588.0" lengthAdjust="spacingAndGlyphs">Secrets                                                               </text>
