<text x="660.8" y="166" fill="#cdd6f4" textLength="336.0" lengthAdjust="spacingAndGlyphs"> GH_TOKEN to put it in the agent&#x27;s      </text>
<text x="996.8" y="166" fill="#344264" textLength="8.4" lengthAdjust="spacingAndGlyphs">│</text>
<text x="47.6" y="184" fill="#7c89b0" textLength="42.0" lengthAdjust="spacingAndGlyphs">  ├─ </text>
<text x="89.6" y="184" fill="#cdd6f4" textLength="142.8" lengthAdjust="spacingAndGlyphs">backup-password  </text>
<text x="232.4" y="184" fill="#7c89b0" textLength="92.4" lengthAdjust="spacingAndGlyphs">○ Not given</text>
<text x="652.4" y="184" fill="#344264" textLength="8.4" lengthAdjust="spacingAndGlyphs">│</text>
<text x="660.8" y="184" fill="#cdd6f4" textLength="336.0" lengthAdjust="spacingAndGlyphs"> environment, or a path such as         </text>
<text x="996.8" y="184" fill="#344264" textLength="8.4" lengthAdjust="spacingAndGlyphs">│</text>
<rect x="30.8" y="188" width="605.3" height="18.5" fill="#212c46"/>
<text x="30.8" y="202" fill="#74b2ff" textLength="16.8" lengthAdjust="spacingAndGlyphs">▌ </text>
<text x="47.6" y="202" fill="#7c89b0" textLength="42.0" lengthAdjust="spacingAndGlyphs">  └─ </text>
<text x="89.6" y="202" fill="#cdd6f4" textLength="67.2" lengthAdjust="spacingAndGlyphs">github  </text>
<text x="156.8" y="202" fill="#9ed88c" textLength="159.6" lengthAdjust="spacingAndGlyphs">● variable GH_TOKEN</text>
<text x="652.4" y="202" fill="#344264" textLength="8.4" lengthAdjust="spacingAndGlyphs">│</text>
<text x="660.8" y="202" fill="#cdd6f4" textLength="336.0" lengthAdjust="spacingAndGlyphs"> ~/.config/app/token to write it to a   </text>
<text x="996.8" y="202" fill="#344264" textLength="8.4" lengthAdjust="spacingAndGlyphs">│</text>
<text x="652.4" y="220" fill="#344264" textLength="8.4" lengthAdjust="spacingAndGlyphs">│</text>
<text x="660.8" y="220" fill="#cdd6f4" textLength="336.0" lengthAdjust="spacingAndGlyphs"> file. Empty, or x, means the host does </text>
<text x="996.8" y="220" fill="#344264" textLength="8.4" lengthAdjust="spacingAndGlyphs">│</text>
<text x="47.6" y="238" fill="#7c89b0" textLength="588.0" lengthAdjust="spacingAndGlyphs">They reach a running host with &quot;Install secrets and registry logins&quot; o</text>
<text x="652.4" y="238" fill="#344264" textLength="8.4" lengthAdjust="spacingAndGlyphs">│</text>
<text x="660.8" y="238" fill="#cdd6f4" textLength="336.0" lengthAdjust="spacingAndGlyphs"> not get it. A secret given as GH_TOKEN </text>
<text x="996.8" y="238" fill="#344264" textLength="8.4" lengthAdjust="spacingAndGlyphs">│</text>
<text x="652.4" y="256" fill="#344264" textLength="8.4" lengthAdjust="spacingAndGlyphs">│</text>
<text x="660.8" y="256" fill="#cdd6f4" textLength="336.0" lengthAdjust="spacingAndGlyphs"> also logs git in to GitHub through gh. </text>
<text x="996.8" y="256" fill="#344264" textLength="8.4" lengthAdjust="spacingAndGlyphs">│</text>
<text x="652.4" y="274" fill="#344264" textLength="8.4" lengthAdjust="spacingAndGlyphs">│</text>
<text x="660.8" y="274" fill="#cdd6f4" textLength="336.0" lengthAdjust="spacingAndGlyphs"> Values are set on the Secrets tab of   </text>
<text x="996.8" y="274" fill="#344264" textLength="8.4" lengthAdjust="spacingAndGlyphs">│</text>
