<text x="467.6" y="76" fill="#7c89b0" textLength="67.2" lengthAdjust="spacingAndGlyphs">Install </text>
<text x="870.8" y="76" fill="#7c89b0" textLength="134.4" lengthAdjust="spacingAndGlyphs">cloud-1 › set-up</text>
<text x="47.6" y="112" fill="#74b2ff" class="b" textLength="588.0" lengthAdjust="spacingAndGlyphs">Registries                                                            </text>
