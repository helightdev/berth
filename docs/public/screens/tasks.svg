<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 566 562" width="566" height="562" role="img" aria-label="berth tasks studio">
<style>text{font-family:'JetBrains Mono','Cascadia Mono','DejaVu Sans Mono',Menlo,Consolas,monospace;font-size:14px;white-space:pre}.b{font-weight:700}</style>
<rect width="100%" height="100%" rx="10" fill="#0d111c" stroke="#344264"/>
<circle cx="20" cy="17.0" r="5" fill="#344264"/><circle cx="38" cy="17.0" r="5" fill="#344264"/><circle cx="56" cy="17.0" r="5" fill="#344264"/>
<text x="282.8" y="22.0" fill="#7c89b0" text-anchor="middle">berth tasks studio</text>
<text x="14.0" y="58" fill="#74b2ff" textLength="8.4" lengthAdjust="spacingAndGlyphs">$</text>
<text x="22.4" y="58" fill="#cdd6f4" textLength="529.2" lengthAdjust="spacingAndGlyphs"> berth tasks studio                                            </text>
<text x="14.0" y="76" fill="#cdd6f4" textLength="537.6" lengthAdjust="spacingAndGlyphs">System                                                          </text>
<text x="14.0" y="94" fill="#cdd6f4" textLength="537.6" lengthAdjust="spacingAndGlyphs">  status                 Status                                 </text>
<text x="14.0" y="112" fill="#cdd6f4" textLength="537.6" lengthAdjust="spacingAndGlyphs">                           + Last snapshot                      </text>
<text x="14.0" y="130" fill="#cdd6f4" textLength="537.6" lengthAdjust="spacingAndGlyphs">  smoke                  Self-Test                              </text>
<text x="14.0" y="148" fill="#cdd6f4" textLength="537.6" lengthAdjust="spacingAndGlyphs">  update                 Update                                 </text>
<text x="14.0" y="166" fill="#cdd6f4" textLength="537.6" lengthAdjust="spacingAndGlyphs">                           + Update Claude Code                 </text>
<text x="14.0" y="184" fill="#cdd6f4" textLength="537.6" lengthAdjust="spacingAndGlyphs">                           + Update Codex                       </text>
<text x="14.0" y="202" fill="#cdd6f4" textLength="537.6" lengthAdjust="spacingAndGlyphs">                           + Update T3 Code                     </text>
<text x="14.0" y="220" fill="#cdd6f4" textLength="537.6" lengthAdjust="spacingAndGlyphs">  reboot                 Reboot                                 </text>
<text x="14.0" y="238" fill="#cdd6f4" textLength="537.6" lengthAdjust="spacingAndGlyphs">Access                                                          </text>
<text x="14.0" y="256" fill="#cdd6f4" textLength="537.6" lengthAdjust="spacingAndGlyphs">  access                 Access links and desktop password      </text>
<text x="14.0" y="274" fill="#cdd6f4" textLength="537.6" lengthAdjust="spacingAndGlyphs">  publish                Publish desktop and T3 on the tailnet  </text>
<text x="14.0" y="292" fill="#cdd6f4" textLength="537.6" lengthAdjust="spacingAndGlyphs">  pair                   Use T3 from another device             </text>
<text x="14.0" y="310" fill="#cdd6f4" textLength="537.6" lengthAdjust="spacingAndGlyphs">Sync                                                            </text>
<text x="14.0" y="328" fill="#cdd6f4" textLength="537.6" lengthAdjust="spacingAndGlyphs">  secrets                Secrets and registry logins            </text>
<text x="14.0" y="346" fill="#cdd6f4" textLength="537.6" lengthAdjust="spacingAndGlyphs">Sign-In                                                         </text>
<text x="14.0" y="364" fill="#cdd6f4" textLength="537.6" lengthAdjust="spacingAndGlyphs">  sign-in:status         Show who is signed in                  </text>
<text x="14.0" y="382" fill="#cdd6f4" textLength="537.6" lengthAdjust="spacingAndGlyphs">                           + Claude Code sign-in                </text>
<text x="14.0" y="400" fill="#cdd6f4" textLength="537.6" lengthAdjust="spacingAndGlyphs">                           + Codex sign-in                      </text>
<text x="14.0" y="418" fill="#cdd6f4" textLength="537.6" lengthAdjust="spacingAndGlyphs">                           + GitHub sign-in                     </text>
<text x="14.0" y="436" fill="#cdd6f4" textLength="537.6" lengthAdjust="spacingAndGlyphs">  claude:login           Sign in to Claude Code                 </text>
<text x="14.0" y="454" fill="#cdd6f4" textLength="537.6" lengthAdjust="spacingAndGlyphs">  codex:login            Sign in to Codex                       </text>
<text x="14.0" y="472" fill="#cdd6f4" textLength="537.6" lengthAdjust="spacingAndGlyphs">  github:login           Sign in to GitHub                      </text>
<text x="14.0" y="490" fill="#cdd6f4" textLength="537.6" lengthAdjust="spacingAndGlyphs">Backup                                                          </text>
<text x="14.0" y="508" fill="#cdd6f4" textLength="537.6" lengthAdjust="spacingAndGlyphs">  backup:snapshot        Back up now                            </text>
<text x="14.0" y="526" fill="#cdd6f4" textLength="537.6" lengthAdjust="spacingAndGlyphs">  backup:list            List snapshots                         </text>
<text x="14.0" y="544" fill="#cdd6f4" textLength="537.6" lengthAdjust="spacingAndGlyphs">  backup:restore         Restore a snapshot  snapshot=…         </text>
</svg>
