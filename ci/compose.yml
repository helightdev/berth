# The checks and the end-to-end tests, run by ci/run.sh.
#
# dev     the toolchain, with the checkout at /src, as the user who owns it
# runner  the same image on a network of its own, which drives the tests
# studio  the test host the tests set up over SSH
# dock    a second test host, for the tests that need one to themselves
#         (tests/e2e/run.py says which); its keys come from /seed/dock
# headscale  a Headscale server the test host can join (see below)
# postgres   a throw-away PostgreSQL for the store's tests (rust-tests)
#
# The e2e network is internal: nothing on it reaches beyond it.
name: ${BERTH_CI_PROJECT:-berth-ci}

x-dev: &dev
  image: ${BERTH_CI_DEV_IMAGE:-berth-ci-dev}
  build:
    context: ..
    dockerfile: ci/dev.Dockerfile
  working_dir: /src
  # SELinux would keep the container out of the checkout otherwise.
  security_opt: [label=disable]
  environment:
    PYTHONDONTWRITEBYTECODE: "1"
    CARGO_INCREMENTAL: ${BERTH_CI_INCREMENTAL:-0}
    CI: ${CI:-}

services:
  dev:
    <<: *dev
    profiles: [dev]
    user: ${BERTH_CI_USER:-1000:1000}
    volumes:
      - ..:/src
      - ${BERTH_CI_TARGET:-target}:/src/target
      - ${BERTH_CI_CARGO:-cargo}:/cache/cargo
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      CARGO_INCREMENTAL: ${BERTH_CI_INCREMENTAL:-0}
      CI: ${CI:-}
      # Set by ci/run.sh while the postgres service runs; the store's tests
      # skip PostgreSQL without it.
      BERTH_TEST_POSTGRES: ${BERTH_CI_POSTGRES:-}

  # The database the store's tests use, empty at each start and gone after.
  # Its password is made up: it is reachable only from the project's network.
  postgres:
    image: postgres:17-alpine
    profiles: [dev]
    environment:
      POSTGRES_USER: berth
      POSTGRES_PASSWORD: berth-ci
      POSTGRES_DB: berth
    tmpfs: [/var/lib/postgresql/data]

  runner:
    <<: *dev
    profiles: [e2e]
    # Root, for the key it hands the test host in /seed. It writes nothing to
    # the checkout, which is mounted read-only.
    user: "0:0"
    networks: [e2e]
    depends_on: [studio, dock, headscale]
    volumes:
      - ..:/src:ro
      - ${BERTH_CI_TARGET:-target}:/src/target:ro
      - seed:/seed
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      BERTH_E2E: "1"
      BERTH_E2E_HOST: studio

  studio:
    image: ${BERTH_CI_HOST_IMAGE:-berth-ci-host}
    build:
      context: ..
      dockerfile: ci/host.Dockerfile
    profiles: [e2e]
    hostname: studio
    networks: [e2e]
    volumes:
      - seed:/seed:ro

  dock:
    image: ${BERTH_CI_HOST_IMAGE:-berth-ci-host}
    profiles: [e2e]
    hostname: dock
    networks: [e2e]
    environment:
      BERTH_CI_SEED: /seed/dock
    volumes:
      - seed:/seed:ro

  # A Headscale server for joining a tailnet, with nothing of the internet:
  # its DERP map names a relay that does not exist. At start it makes the user
  # `berth` and an API key, and hands the key out over plain HTTP:
  #
  #   login server  http://headscale:8080 (its API is there too, under /api/v1)
  #   API key       GET http://headscale:8081/api-key (empty until it is ready)
  #
  # A tailscale client joins it with `tailscale up --login-server
  # http://headscale:8080 --auth-key=...`; in a container without a tun
  # device, tailscaled runs with --tun=userspace-networking. Another test
  # can use it as it is: add `headscale` to its depends_on, and see
  # headscale() in tests/e2e/harness.py.
  headscale:
    image: headscale/headscale:0.29.6-debug
    profiles: [e2e]
    hostname: headscale
    networks: [e2e]
    entrypoint: ["/busybox/sh", "-c"]
    command:
      - |
        set -e
        mkdir -p /etc/headscale /var/lib/headscale /var/run/headscale /www
        cat >/etc/headscale/derp.yaml <<'EOF'
        regions:
          900:
            regionid: 900
            regioncode: none
            regionname: Nowhere
            nodes:
              - name: 900a
                regionid: 900
                hostname: derp.invalid
                stunport: -1
        EOF
        cat >/etc/headscale/config.yaml <<'EOF'
        server_url: http://headscale:8080
        listen_addr: 0.0.0.0:8080
        metrics_listen_addr: 127.0.0.1:9090
        grpc_listen_addr: 127.0.0.1:50443
        noise:
          private_key_path: /var/lib/headscale/noise_private.key
        prefixes:
          v4: 100.64.0.0/10
          v6: fd7a:115c:a1e0::/48
        derp:
          server:
            enabled: false
          urls: []
          paths: [/etc/headscale/derp.yaml]
          auto_update_enabled: false
        database:
          type: sqlite
          sqlite:
            path: /var/lib/headscale/db.sqlite
        dns:
          magic_dns: true
          base_domain: tailnet.test
          override_local_dns: false
        unix_socket: /var/run/headscale/headscale.sock
        unix_socket_permission: "0770"
        EOF
        : >/www/api-key
        busybox httpd -p 8081 -h /www
        headscale serve &
        until headscale users list >/dev/null 2>&1; do sleep 0.2; done
        headscale users create berth >/dev/null
        headscale apikeys create --expiration 1d >/www/api-key.new
        mv /www/api-key.new /www/api-key
        echo "headscale: ready"
        wait

networks:
  e2e:
    internal: true

# The caches have fixed names, so every project shares them.
volumes:
  target:
    name: berth-ci-target
  cargo:
    name: berth-ci-cargo
  seed:
