StylesPath = .vale/styles
MinAlertLevel = suggestion

# AI tells, punctuation, filler and puffery come from these; Berth adds what's ours (asides, comma lists,
# sentence length, restating, assertions, headings). `vale sync` fetches them into .vale/styles.
Packages = https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells.zip, Voices

[*.{md,mdx}]
BasedOnStyles = Vale, ai-tells, Voices, Berth
ai-tells = warning
ai-tells.EmDashUsage = error
ai-tells.OverusedVocabulary = error
ai-tells.PromotionalPuffery = error
Vale.Spelling = NO

# Licenses, vendored code and build output aren't ours to word.
[{**/LICENSE*,cli/vendor/**,docs/node_modules/**,docs/.next/**,docs/out/**,docs/.source/**,build/**,.vale/**}]
BasedOnStyles =

# Tables put a group next to a task of the same name.
[README.md]
Vale.Repetition = NO
