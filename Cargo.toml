[workspace]
resolver = "3"
members = ["crates/berth-api", "crates/berth-pty", "crates/berth-core", "crates/berth-tui", "crates/berth", "crates/berthd", "crates/box", "crates/berth-web"]
# The vendored crate is a member because it lives inside; it is left out of what
# is built, tested and linted by default.
default-members = ["crates/berth-api", "crates/berth-pty", "crates/berth-core", "crates/berth-tui", "crates/berth", "crates/berthd", "crates/box"]

[workspace.package]
version = "0.4.1"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
berth-api = { path = "crates/berth-api" }
berth-pty = { path = "crates/berth-pty" }
berth-core = { path = "crates/berth-core" }
berth-tui = { path = "crates/berth-tui" }
tui-input = { path = "crates/vendor/tui-input", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
tempfile = "3"
vt100 = "=0.16.2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "io-std", "process", "sync", "time", "signal", "fs"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-axum = "0.2"
rusqlite = { version = "0.40", features = ["bundled"] }

# Development and test builds: line numbers in backtraces, and no debug
# information for dependencies, which makes them quicker to build and link.
# For a debugger, CARGO_PROFILE_DEV_DEBUG=true gives berth's own crates full
# debug information.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
strip = true

# The page of berth serve: small rather than fast, since it is carried in berth.
[profile.web]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1

# What a development or test build of berth carries. berthd and box are built
# incrementally, and small, as berth packs them. The page keeps its
# optimisation without the whole-program link that takes most of its build
# time after a change.
[profile.host-dev]
inherits = "dev"
opt-level = "s"
debug = false
strip = true

[profile.web-dev]
inherits = "web"
lto = false
codegen-units = 16
incremental = true
