[workspace]
resolver = "3"
members = ["crates/berth-api", "crates/berth-pty", "crates/berth-core", "cli", "host/berthd", "host/box"]
# The vendored crate is a member because it lives inside; it is left out of what
# is built, tested and linted by default.
default-members = ["crates/berth-api", "crates/berth-pty", "crates/berth-core", "cli", "host/berthd", "host/box"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
berth-api = { path = "crates/berth-api" }
berth-pty = { path = "crates/berth-pty" }
berth-core = { path = "crates/berth-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
tempfile = "3"
vt100 = "=0.16.2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "io-std", "process", "sync", "time", "signal", "fs"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-axum = "0.2"
rusqlite = { version = "0.40", features = ["bundled"] }

[profile.release]
strip = true
