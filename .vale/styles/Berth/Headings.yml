  - Ansible
  - Claude Code
  - Codex
  - Pi
  - T3 Code
  - GitHub
  - Unity
  - Tailscale
  - Cockpit
  - Docker
  - QEMU
  - Ubuntu
  - Nexus
  - Vale
  - Fumadocs
  - SSH
  - USB
  - ISO
  - UI
  - CLI
  - API
  - JSON
  - HTTPS
  - VNC
  - Wi-Fi
  - AGENT.md
