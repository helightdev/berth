name: Save the Rust build
description: >-
  Keep the target directory for the next runs, with the tree it was built
  from. Only main saves: a pull request reads main's and leaves its own.
inputs:
  cache:
    description: The name of the cache, as given to the rust action
    required: true
runs:
  using: composite
  steps:
    - name: Record the tree
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      shell: bash
      run: python3 ci/mtimes.py save target
    - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@v4
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          target
          provision/ansible/roles/devbox/files/bin
        key: cargo-${{ inputs.cache }}-${{ hashFiles('Cargo.lock', 'ci/dev.Dockerfile') }}-${{ github.sha }}
