name: Build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl, wasm32-unknown-unknown
      - name: musl compiler for the bundled SQLite
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - uses: Swatinem/rust-cache@v2
      - name: Build berth, with berthd and box inside
        run: cargo build --release --locked --target x86_64-unknown-linux-musl -p berth
      - name: Pack
        run: |
          mkdir dist
          cp target/x86_64-unknown-linux-musl/release/berth LICENSE dist/
          tar -czf berth-x86_64-linux.tar.gz -C dist berth LICENSE
          sha256sum berth-x86_64-linux.tar.gz > berth-x86_64-linux.tar.gz.sha256
          cp target/host/x86_64-unknown-linux-musl/release/berthd target/host/x86_64-unknown-linux-musl/release/box dist/
      - name: Build berth with the page for a browser
        run: cargo build --release --locked --target x86_64-unknown-linux-musl -p berth --features web
      - name: Pack it
        run: |
          cp target/x86_64-unknown-linux-musl/release/berth dist/berth
          tar -czf berth-web-x86_64-linux.tar.gz -C dist berth LICENSE
          sha256sum berth-web-x86_64-linux.tar.gz > berth-web-x86_64-linux.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: berth-x86_64-linux
          path: |
            berth-x86_64-linux.tar.gz
            berth-x86_64-linux.tar.gz.sha256
            berth-web-x86_64-linux.tar.gz
            berth-web-x86_64-linux.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: host-programs-x86_64-linux
          path: |
            dist/berthd
            dist/box
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: binary
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: berth-x86_64-linux
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GITHUB_REF_NAME" > VERSION
          gh release create "$GITHUB_REF_NAME" --generate-notes berth-x86_64-linux.tar.gz berth-x86_64-linux.tar.gz.sha256 berth-web-x86_64-linux.tar.gz berth-web-x86_64-linux.tar.gz.sha256 install.sh VERSION
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=edge,branch=main
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: container/berth.Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
