name: Build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # A tag vX.Y.Z builds version X.Y.Z. Any other build says the version in
      # Cargo.toml, which is that of the latest release.
      - name: The version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=${GITHUB_REF_NAME#v}
            if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
              echo "::error::$GITHUB_REF_NAME is not a version tag such as v1.2.0 or v1.2.0-rc.1"
              exit 1
            fi
            echo "BERTH_BUILD_VERSION=$version" >> "$GITHUB_ENV"
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl, wasm32-unknown-unknown
      - name: musl compiler for the bundled SQLite
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - uses: Swatinem/rust-cache@v2
      - name: Build berth, with berthd and box inside
        run: cargo build --release --locked --target x86_64-unknown-linux-musl -p berth
      - name: Pack
        run: |
          mkdir dist
          cp target/x86_64-unknown-linux-musl/release/berth LICENSE-MIT LICENSE-APACHE dist/
          tar -czf berth-x86_64-linux.tar.gz -C dist berth LICENSE-MIT LICENSE-APACHE
          sha256sum berth-x86_64-linux.tar.gz > berth-x86_64-linux.tar.gz.sha256
          cp target/host/x86_64-unknown-linux-musl/release/berthd target/host/x86_64-unknown-linux-musl/release/box dist/
      - name: Build berth with the page for a browser
        run: cargo build --release --locked --target x86_64-unknown-linux-musl -p berth --features web
      - name: Pack it
        run: |
          cp target/x86_64-unknown-linux-musl/release/berth dist/berth
          tar -czf berth-web-x86_64-linux.tar.gz -C dist berth LICENSE-MIT LICENSE-APACHE
          sha256sum berth-web-x86_64-linux.tar.gz > berth-web-x86_64-linux.tar.gz.sha256
      - name: Check the versions
        # berth in both archives, and the berthd and box it carries, all say the same.
        run: |
          want=${BERTH_BUILD_VERSION:-$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)}
          mkdir check check-web
          tar -xzf berth-x86_64-linux.tar.gz -C check berth
          tar -xzf berth-web-x86_64-linux.tar.gz -C check-web berth
          for program in check/berth check-web/berth dist/berthd dist/box; do
            said=$("$program" --version)
            echo "$program: $said"
            case "$said" in
              "${program##*/} $want" | "${program##*/} $want "*) ;;
              *) echo "::error::$program says $said, not $want"; exit 1 ;;
            esac
          done
          rm -r check check-web
      - uses: actions/upload-artifact@v4
        with:
          name: berth-x86_64-linux
          path: |
            berth-x86_64-linux.tar.gz
            berth-x86_64-linux.tar.gz.sha256
            berth-web-x86_64-linux.tar.gz
            berth-web-x86_64-linux.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: host-programs-x86_64-linux
          path: |
            dist/berthd
            dist/box
  # berth-remote for Windows: the page of berth serve in a terminal, to use a
  # server's hosts from there. berth itself runs on Linux.
  remote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "BERTH_BUILD_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: MinGW, the linker and the compiler for ring
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64
      - uses: Swatinem/rust-cache@v2
      - name: Build berth-remote for Windows
        run: cargo build --release --locked --target x86_64-pc-windows-gnu -p berth-remote
      - name: Pack
        run: |
          mkdir dist
          cp target/x86_64-pc-windows-gnu/release/berth-remote.exe LICENSE-MIT LICENSE-APACHE dist/
          (cd dist && zip -q -X ../berth-remote-x86_64-windows.zip berth-remote.exe LICENSE-MIT LICENSE-APACHE)
          sha256sum berth-remote-x86_64-windows.zip > berth-remote-x86_64-windows.zip.sha256
      - name: Check the version
        # Without Windows to run it on, the version is looked for in the program.
        run: |
          want=${BERTH_BUILD_VERSION:-$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)}
          grep -aqF "$want" dist/berth-remote.exe \
            || { echo "::error::berth-remote.exe does not carry $want"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: berth-remote-x86_64-windows
          path: |
            berth-remote-x86_64-windows.zip
            berth-remote-x86_64-windows.zip.sha256
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [binary, remote]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: berth-x86_64-linux
      - uses: actions/download-artifact@v4
        with:
          name: berth-remote-x86_64-windows
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GITHUB_REF_NAME" > VERSION
          # A tag such as v0.4.0-rc.1 is a pre-release, which berth update and
          # install.sh pass over.
          prerelease=
          case "$GITHUB_REF_NAME" in *-*) prerelease=--prerelease ;; esac
          # A release made on GitHub's page exists already, and only lacks the files.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes $prerelease
          gh release upload "$GITHUB_REF_NAME" --clobber berth-x86_64-linux.tar.gz berth-x86_64-linux.tar.gz.sha256 berth-web-x86_64-linux.tar.gz berth-web-x86_64-linux.tar.gz.sha256 berth-remote-x86_64-windows.zip berth-remote-x86_64-windows.zip.sha256 install.sh install.ps1 VERSION
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # A tag vX.Y.Z builds version X.Y.Z. Any other build says the version in
      # Cargo.toml, which is that of the latest release.
      - name: The version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=${GITHUB_REF_NAME#v}
            if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
              echo "::error::$GITHUB_REF_NAME is not a version tag such as v1.2.0 or v1.2.0-rc.1"
              exit 1
            fi
            echo "BERTH_BUILD_VERSION=$version" >> "$GITHUB_ENV"
          fi
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=edge,branch=main
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: container/berth.Dockerfile
          build-args: BERTH_BUILD_VERSION=${{ env.BERTH_BUILD_VERSION }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  # main says the version of the latest release, so that a build from it is
  # never older than what berth update offers. A pre-release leaves it alone.
  main:
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    needs: [release, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: dtolnay/rust-toolchain@stable
      - name: Set the version on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          current=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "$(printf '%s\n' "$current" "$version" | sort -V | tail -n 1)" = "$current" ]; then
            echo "main says $current, which is not older than $version"
            exit 0
          fi
          sed -i "/^\[workspace.package\]/,/^\[/s/^version = \".*\"/version = \"$version\"/" Cargo.toml
          cargo update --workspace
          # The API documents name the version too.
          sed -i -E "s/^( *\"version\": )\"${current//./\\.}\"\$/\1\"$version\"/" docs/openapi/*.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
          git commit -am "chore(release): $version"
          # main takes changes only as pull requests, so the version goes there as one.
          branch="release/$version"
          git push --force origin "HEAD:refs/heads/$branch"
          gh pr create --base main --head "$branch" --title "chore(release): $version" \
            --body "Sets the version on main to $version, the release that was just published. Merge it when its checks have passed."
          # A push with this job's token starts no workflows of its own.
          gh workflow run CI --ref "$branch"
