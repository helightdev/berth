name: Docs
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      # Where Pages serves the site: a folder named after the repository on
      # github.io, the root on a domain of its own.
      - id: pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The site has the page of berth serve under /web, which building berth makes.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl, wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: npm install --no-audit --no-fund && npm run build
        working-directory: docs
        env:
          DOCS_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - run: test -f docs/out/web/berth-web_bg.wasm
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/out
  # Needs Pages with the source "GitHub Actions" in the repository's settings.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
