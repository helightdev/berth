name: CI
on:
  # A pull request from a branch here would otherwise run everything twice.
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
# The checks and the end-to-end tests run ci/run.sh, as on a developer's
# machine. Image layers are kept in GitHub's cache; cargo's downloads and the
# target directory are a directory the cache action keeps.
env:
  BERTH_CI_NO_BUILD: '1'
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - run: echo "BERTH_CI_CACHE=$RUNNER_TEMP/berth-ci-cache" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - name: Build the dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ci/dev.Dockerfile
          tags: berth-ci-dev
          load: true
          cache-from: type=gha,scope=berth-ci-dev
          cache-to: type=gha,scope=berth-ci-dev,mode=max
      - uses: actions/cache@v4
        with:
          path: ${{ env.BERTH_CI_CACHE }}
          key: checks-${{ hashFiles('Cargo.lock', 'ci/dev.Dockerfile') }}-${{ github.sha }}
          restore-keys: checks-${{ hashFiles('Cargo.lock', 'ci/dev.Dockerfile') }}-
      - name: Checks
        run: ci/run.sh check
      - name: Keep the cache small
        if: always()
        run: rm -rf "$BERTH_CI_CACHE/target/debug/incremental" "$BERTH_CI_CACHE/target/tmp"

  # berth is built once, here, and each shard of the end-to-end tests runs it
  # against a test host of its own. Only this job saves the cargo cache and the
  # test host's image layers, so the shards do not race to save the same keys.
  e2e-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      - uses: actions/checkout@v7
      - run: echo "BERTH_CI_CACHE=$RUNNER_TEMP/berth-ci-cache" >> "$GITHUB_ENV"
      - id: shards
        run: echo "shards=$(python3 tests/e2e/run.py --shards)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Build the dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ci/dev.Dockerfile
          tags: berth-ci-dev
          load: true
          cache-from: type=gha,scope=berth-ci-dev
      - name: Build the test host's image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ci/host.Dockerfile
          tags: berth-ci-host
          cache-from: type=gha,scope=berth-ci-host
          cache-to: type=gha,scope=berth-ci-host,mode=max
      - uses: actions/cache@v4
        with:
          path: ${{ env.BERTH_CI_CACHE }}
          key: e2e-${{ hashFiles('Cargo.lock', 'ci/dev.Dockerfile') }}-${{ github.sha }}
          restore-keys: e2e-${{ hashFiles('Cargo.lock', 'ci/dev.Dockerfile') }}-
      - name: Build berth
        run: ci/run.sh run cargo build --locked -p berth --features web
      # berth, and the berthd and box it puts into the role's files. A tar
      # keeps their modes, which an artifact does not.
      - name: Pack what the shards test
        run: |
          tar -cf "$RUNNER_TEMP/e2e-berth.tar" -C "$BERTH_CI_CACHE" target/debug/berth \
            -C "$GITHUB_WORKSPACE" provision/ansible/roles/devbox/files/bin
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-berth
          path: ${{ runner.temp }}/e2e-berth.tar
          retention-days: 1
          if-no-files-found: error
      - name: Keep the cache small
        if: always()
        run: rm -rf "$BERTH_CI_CACHE/target/debug/incremental" "$BERTH_CI_CACHE/target/tmp"

  e2e-shard:
    needs: e2e-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.e2e-build.outputs.shards) }}
    env:
      BERTH_CI_PREBUILT: '1'
    steps:
      - uses: actions/checkout@v7
      - run: echo "BERTH_CI_CACHE=$RUNNER_TEMP/berth-ci-cache" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - name: Build the dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ci/dev.Dockerfile
          tags: berth-ci-dev
          load: true
          cache-from: type=gha,scope=berth-ci-dev
      - name: Build the test host's image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ci/host.Dockerfile
          tags: berth-ci-host
          load: true
          cache-from: type=gha,scope=berth-ci-host
      - uses: actions/download-artifact@v4
        with:
          name: e2e-berth
          path: ${{ runner.temp }}
      - name: Unpack berth
        run: |
          mkdir -p "$BERTH_CI_CACHE"
          tar -xf "$RUNNER_TEMP/e2e-berth.tar" -C "$BERTH_CI_CACHE" target
          tar -xf "$RUNNER_TEMP/e2e-berth.tar" provision
      - name: End-to-end tests
        run: ci/run.sh e2e --shard "${{ matrix.shard }}"
      - name: Upload the test host's logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ matrix.shard }}
          path: build/ci/logs
          if-no-files-found: ignore

  # The check that branch protection requires. A job that was skipped would
  # count as passed, so this one runs always and looks at every result.
  e2e:
    needs: [e2e-build, e2e-shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            [[ $result == success ]] || exit 1
          done

  prose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VALE_VERSION: 3.25.1
    steps:
      - uses: actions/checkout@v7
      - name: Install Vale
        run: |
          curl -fsSL "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" vale
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: vale --minAlertLevel=warning README.md docs/content/docs plugins/*/guide.md
