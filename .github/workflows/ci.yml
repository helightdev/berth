name: CI
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: x86_64-unknown-linux-musl
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ansible for the template and syntax checks
        run: python3 -m venv .venv && .venv/bin/pip install -r requirements.txt
      - name: Rust tests (the build makes berthd and box for the hosts)
        run: cargo test --locked
      - name: Python tests
        run: .venv/bin/python -m unittest discover -s tests -v
      - name: Shell syntax
        run: |
          for script in install.sh bin/*.sh bootstrap/*.sh container/*.sh ansible/roles/devbox/files/*.sh ansible/roles/devbox/files/tasks/*.sh plugins/*/files/*.sh; do
            bash -n "$script"
          done
      - name: Ansible syntax
        run: .venv/bin/ansible-playbook -i localhost, ansible/site.yml --syntax-check
      - name: Formatting and lints
        run: |
          cargo fmt --check -p berth-api -p berth-pty -p berth-core -p berth -p berthd -p box
          cargo clippy --locked --all-targets -- -D warnings
  prose:
    runs-on: ubuntu-latest
    env:
      VALE_VERSION: 3.25.1
    steps:
      - uses: actions/checkout@v4
      - name: Install Vale
        run: |
          curl -fsSL "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" vale
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: vale --minAlertLevel=warning README.md docs/content/docs plugins/*/guide.md
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund && npm run build
        working-directory: docs
