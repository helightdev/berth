name: CI
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ansible for the template and syntax checks
        run: make tools
      - name: Tests and shell checks
        run: make validate
      - name: Ansible syntax
        run: make syntax
      - name: Formatting and lints
        run: |
          cargo fmt --manifest-path cli/Cargo.toml --check
          cargo clippy --locked --manifest-path cli/Cargo.toml --all-targets -- -D warnings
  prose:
    runs-on: ubuntu-latest
    env:
      VALE_VERSION: 3.25.1
    steps:
      - uses: actions/checkout@v4
      - name: Install Vale
        run: |
          curl -fsSL "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" vale
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: make prose
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: make docs
