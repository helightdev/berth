name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
# The checks and the end-to-end tests run ci/run.sh, as on a developer's
# machine. Image layers are kept in GitHub's cache; cargo's downloads and the
# target directory are a directory the cache action keeps.
env:
  BERTH_CI_NO_BUILD: '1'
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: echo "BERTH_CI_CACHE=$RUNNER_TEMP/berth-ci-cache" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Build the dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ci/dev.Dockerfile
          tags: berth-ci-dev
          load: true
          cache-from: type=gha,scope=berth-ci-dev
          cache-to: type=gha,scope=berth-ci-dev,mode=max
      - uses: actions/cache@v4
        with:
          path: ${{ env.BERTH_CI_CACHE }}
          key: checks-${{ hashFiles('Cargo.lock', 'ci/dev.Dockerfile') }}-${{ github.sha }}
          restore-keys: checks-${{ hashFiles('Cargo.lock', 'ci/dev.Dockerfile') }}-
      - name: Checks
        run: ci/run.sh check
      - name: Keep the cache small
        if: always()
        run: rm -rf "$BERTH_CI_CACHE/target/debug/incremental" "$BERTH_CI_CACHE/target/tmp"

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: echo "BERTH_CI_CACHE=$RUNNER_TEMP/berth-ci-cache" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Build the dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ci/dev.Dockerfile
          tags: berth-ci-dev
          load: true
          cache-from: type=gha,scope=berth-ci-dev
      - name: Build the test host's image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ci/host.Dockerfile
          tags: berth-ci-host
          load: true
          cache-from: type=gha,scope=berth-ci-host
          cache-to: type=gha,scope=berth-ci-host,mode=max
      - uses: actions/cache@v4
        with:
          path: ${{ env.BERTH_CI_CACHE }}
          key: e2e-${{ hashFiles('Cargo.lock', 'ci/dev.Dockerfile') }}-${{ github.sha }}
          restore-keys: e2e-${{ hashFiles('Cargo.lock', 'ci/dev.Dockerfile') }}-
      - name: End-to-end tests
        run: ci/run.sh e2e
      - name: Upload the test host's logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: build/ci/logs
          if-no-files-found: ignore
      - name: Keep the cache small
        if: always()
        run: rm -rf "$BERTH_CI_CACHE/target/debug/incremental" "$BERTH_CI_CACHE/target/tmp"

  prose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VALE_VERSION: 3.25.1
    steps:
      - uses: actions/checkout@v4
      - name: Install Vale
        run: |
          curl -fsSL "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" vale
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: vale --minAlertLevel=warning README.md docs/content/docs plugins/*/guide.md
