name: Bug
description: Something berth does wrong, or something that used to work and doesn't any more
type: Bug
labels: [needs triage]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected and what you got. Your own words are best, even if short.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The relevant output, and `berth run HOST status` if a host is involved. Take addresses, tokens and passwords out first.
      render: text
  - type: input
    id: version
    attributes:
      label: berth --version
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: What you were doing
      options:
        - Not sure
        - Getting a new host running
        - Choosing what a host gets, or applying it
        - Looking after a running host
        - Reaching a host (terminal, SSH, tunnels, desktop)
        - Sign-ins, secrets, keys or registries
        - Making hosts or resources on a node
        - Using an agent or tool on a host
        - Running a berth server for others
        - Writing a plugin or using the API
  - type: dropdown
    id: surface
    attributes:
      label: Where you saw it
      options:
        - The screens
        - The command line
        - Both
        - On the host itself
  - type: dropdown
    id: client
    attributes:
      label: Where berth runs
      options:
        - Linux
        - macOS
        - Windows
  - type: dropdown
    id: where
    attributes:
      label: How the host was installed
      options:
        - Not about a host
        - USB installer
        - Cloud seed
        - SSH to an existing server
        - Container
