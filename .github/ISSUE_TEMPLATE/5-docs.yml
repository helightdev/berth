name: Documentation
description: The docs are wrong, missing something or hard to follow
type: Documentation
labels: [needs triage]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: A link to the page, or where you looked.
  - type: textarea
    id: what
    attributes:
      label: What's wrong or missing
      description: What you were trying to do and where the docs let you down.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: What you were doing
      options:
        - Not sure
        - Getting a new host running
        - Choosing what a host gets, or applying it
        - Looking after a running host
        - Reaching a host (terminal, SSH, tunnels, desktop)
        - Sign-ins, secrets, keys or registries
        - Making hosts or resources on a node
        - Using an agent or tool on a host
        - Running a berth server for others
        - Writing a plugin or using the API
