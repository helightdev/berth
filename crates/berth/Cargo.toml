[package]
name = "berth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The screens and the client of a berth serve, on every system.
[dependencies]
berth-api = { workspace = true, features = ["client"] }
berth-page.workspace = true
berth-tui.workspace = true
tokio.workspace = true
serde_json = "1"
serde.workspace = true
tempfile = "3"
crossterm = "=0.29.0"
# The command line: its grammar, help, errors and shell completions.
clap = { version = "4.5", features = ["derive", "wrap_help"] }
clap_complete = "4.5"
# The questions and progress drawn inline, below the command.
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
tui-input.workspace = true
futures-util.workspace = true

# The installation, berth serve and the commands, on Linux, where hosts are
# set up from.
[target.'cfg(target_os = "linux")'.dependencies]
berth-core.workspace = true
# For its API document, which berth serve's includes.
berthd = { path = "../berthd" }
axum.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
libc = "0.2"
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# Signs the access tokens of the tests.
ring = "0.17"

