[package]
name = "berth-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Wire types and client for berthd and berth serve"

[dependencies]
serde.workspace = true
serde_json.workspace = true
utoipa.workspace = true
tokio = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }

[features]
default = ["client"]
# The client over a byte stream; without it only the types and tables remain,
# which is what a browser build takes.
client = ["dep:tokio", "dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:tokio-tungstenite", "dep:futures-util"]
