[package]
name = "berth-remote"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The screens of a berth serve in a terminal: the hosts of a berth serve elsewhere, on Linux, macOS or Windows"

[[bin]]
name = "berth-remote"
path = "src/main.rs"

[dependencies]
berth-api = { workspace = true, features = ["client"] }
berth-page.workspace = true
