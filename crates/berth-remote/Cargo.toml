[package]
name = "berth-remote"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The page of berth serve in a terminal: the hosts of a berth serve elsewhere, on Linux, macOS or Windows"

[[bin]]
name = "berth-remote"
path = "src/main.rs"

[dependencies]
berth-api = { workspace = true, features = ["client"] }
berth-page.workspace = true
berth-tui.workspace = true
serde_json.workspace = true
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
crossterm = "=0.29.0"
tokio.workspace = true
futures-util.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
rustls-native-certs = "0.8"

[dev-dependencies]
tempfile.workspace = true
