---
devbox_profile: cloud
devbox_user: agent
devbox_agent_password_hash: ""
devbox_agent_ssh_public_key: ""
devbox_agent_passwordless_sudo: true
# What the agent may do as root: full (everything, no password), limited
# (packages, and restarting plugin services that run as the agent) or none.
# Empty follows devbox_agent_passwordless_sudo, as profiles from before it do.
devbox_agent_privileges: ""
devbox_operator_user: ops
devbox_operator_password_hash: ""
devbox_operator_ssh_public_key: ""
devbox_operator_passwordless_sudo: true
# Ubuntu's own account and group names. useradd refuses a user named like an existing group.
devbox_reserved_names: [root, daemon, bin, sys, adm, tty, disk, lp, mail, news, uucp, man, proxy, kmem, dialout, fax, voice, cdrom, floppy, tape, sudo, audio, dip, www-data, backup, operator, list, irc, src, shadow, utmp, video, sasl, plugdev, staff, games, users, nogroup, admin, docker]
devbox_home: "/home/{{ devbox_user }}"
devbox_timezone: Europe/Berlin
devbox_geometry: 1600x900
# The coding agents, T3 Code and GitHub's CLI are plugins in plugins/. These
# follow from the chosen features; set devbox_plugin_features, not these.
devbox_agent_claude: "{{ 'claude/cli' in devbox_plugin_features }}"
devbox_agent_codex: "{{ 'codex/cli' in devbox_plugin_features }}"
devbox_agent_pi: "{{ 'pi/cli' in devbox_plugin_features }}"
devbox_install_agents: "{{ devbox_agent_claude | bool or devbox_agent_codex | bool or devbox_agent_pi | bool }}"
# T3 Code is a front end that runs the agents, not one of them. Its plugin
# installs it; the role runs it as a service.
devbox_install_t3: "{{ 't3/server' in devbox_plugin_features }}"
devbox_tools_web: "{{ devbox_install_dev_tools | default(true) }}"
devbox_tools_native: "{{ devbox_install_dev_tools | default(true) }}"
devbox_tools_jvm: "{{ devbox_install_dev_tools | default(true) }}"
devbox_tools_dotnet: "{{ devbox_install_dev_tools | default(true) }}"
devbox_tools_scripting: "{{ devbox_install_dev_tools | default(true) }}"
devbox_tools_scientific: "{{ devbox_install_dev_tools | default(true) }}"
devbox_tools_chrome: "{{ devbox_install_dev_tools | default(true) }}"
# Applies to the virtual agent session, not the laptop's physical login.
devbox_software_rendering: true
devbox_codex_version: "0.167.1"
devbox_pi_version: "1.5.1"
# A search engine set here keeps Chrome from showing its "Choose your search
# engine" page on every start until someone picks one. Set to {} to be asked.
devbox_chrome_search:
  DefaultSearchProviderEnabled: true
  DefaultSearchProviderName: Google
  DefaultSearchProviderSearchURL: "https://www.google.com/search?q={searchTerms}"
  DefaultSearchProviderSuggestURL: "https://www.google.com/complete/search?output=chrome&q={searchTerms}"
devbox_mise_version: "2026.11.6"
devbox_mise_sha256: 5fb74f80aab81e0a5ca20eb6414cc69b78ae0cab1deaeb521572ed26d8d4a6e3
devbox_tool_path: "{{ devbox_home }}/.local/bin:{{ devbox_home }}/.local/share/mise/shims:{{ devbox_home }}/.cargo/bin:{{ devbox_home }}/.dotnet/tools:/opt/devbox-tools/venv/bin:/usr/local/bin:/usr/bin:/bin"
devbox_node_versions: ["24.18.0", "22"]
# Exact tool versions can replace selectors such as '10' in host ansible_vars.
devbox_mise_tools:
  bun: "1.3.14"
  deno: "2.9.4"
  pnpm: "10.34.5"
  rust: "1.97.1"
  gradle: "8.12"
  kotlin: "2.1.0"
  scala: "3.3.8"
  sbt: "1.13.0"
  dotnet: "10"
devbox_tool_categories:
  - name: web
    enabled: "{{ devbox_tools_web }}"
    tools: ["bun", "deno", "pnpm"]
    packages: []
    commands: ["bun", "bunx", "deno", "pnpm"]
  - name: native
    enabled: "{{ devbox_tools_native }}"
    tools: ["rust"]
    packages: ["clang", "golang-go"]
    commands: ["clang", "go", "rustc", "cargo", "rustup"]
  - name: jvm
    enabled: "{{ devbox_tools_jvm }}"
    tools: ["gradle", "kotlin", "scala", "sbt"]
    packages: ["openjdk-21-jdk", "maven"]
    commands: ["java", "javac", "mvn", "gradle", "kotlin", "kotlinc", "scala", "scalac", "sbt"]
  - name: dotnet
    enabled: "{{ devbox_tools_dotnet }}"
    tools: ["dotnet"]
    packages: ["libicu-dev", "libunwind8"]
    commands: ["dotnet"]
  - name: scripting
    enabled: "{{ devbox_tools_scripting }}"
    tools: []
    packages: ["ruby-full", "ruby-dev", "bundler", "php-cli", "php-curl", "php-mbstring", "php-xml", "php-zip", "composer", "erlang", "elixir"]
    commands: ["ruby", "gem", "bundle", "php", "composer", "erl", "elixir"]
  - name: scientific
    enabled: "{{ devbox_tools_scientific }}"
    tools: []
    packages: ["r-base"]
    commands: ["R"]
  - name: chrome
    enabled: "{{ devbox_tools_chrome }}"
    tools: []
    packages: []
    commands: ["google-chrome-stable"]
# Optional additions kept outside the role, one directory each (see docs/plugins.md).
# Names of the ones to apply, and where to look for them; a later path wins.
# Plugin features to install, as PLUGIN/FEATURE, applied in this order.
devbox_plugin_features: [claude/cli, codex/cli, pi/cli, t3/server, github/cli]
# Where a plugin is when it is not in the source's plugins/ID directory.
devbox_plugin_dirs: {}
devbox_base_commands: [git, rg, jq, curl, python3, pip, uv, node, npm, gcc, g++, cmake, ninja, ffmpeg, xdotool, wmctrl, Xvfb, glxinfo, vulkaninfo]

devbox_install_playwright: true
devbox_install_docker: true
devbox_install_tailscale: true
# Web console on port 9090, reachable over the tailnet or an SSH tunnel.
devbox_install_cockpit: true
devbox_cockpit_packages: [cockpit, cockpit-storaged, cockpit-packagekit, cockpit-files]
devbox_start_services: true
devbox_tailscale_auth_key: ""
# The Headscale server the host joins, such as https://hs.example.org; empty
# for Tailscale's own service.
devbox_tailscale_login_server: ""
# Set by berth for a host that joins automatically: the command, run where
# berth runs, that prints a new one-use key.
devbox_tailscale_key_command: []
# Publish the desktop and T3 on the tailnet over HTTPS once the host is enrolled.
devbox_tailscale_serve: true
# An agent laptop keeps running with the lid closed. Set to suspend on battery instead.
devbox_lid_suspends_on_battery: false
devbox_bootstrap_ssh_cidr: ""
devbox_manage_firewall: true
# Key-only SSH with no root login. Skipped when that would leave no way in.
devbox_harden_ssh: true
devbox_claude_version: "2.1.322"
devbox_t3_version: "0.1.8"
devbox_t3_sha256: b9c49dc00c23fbbc5961bdaff2d88e556d96c8dbd638c4501e2937c70650a9e5
devbox_playwright_version: "1.65.0"
devbox_packages:
  - sudo
  - ca-certificates
  - curl
  - wget
  - gnupg
  - locales
  - tzdata
  - dbus-user-session
  - dbus-x11
  - xfce4
  - xfce4-terminal
  - mousepad
  - thunar-archive-plugin
  - xarchiver
  # The virtual display also supplies the private RFB backend for noVNC.
  - tigervnc-standalone-server
  - tigervnc-tools
  - novnc
  - websockify
  - xauth
  - x11-utils
  - x11-xserver-utils
  - xdotool
  - wmctrl
  - xclip
  - xsel
  - scrot
  - at-spi2-core
  - xdg-utils
  - xdg-user-dirs
  - xdg-desktop-portal-gtk
  # Secret Service for tools that store credentials: Chrome, git helpers, the Unity CLI.
  - gnome-keyring
  - libsecret-tools
  - libgl1-mesa-dri
  - libgl1
  - libglu1-mesa
  - libegl1
  - libgbm1
  - libvulkan1
  - mesa-vulkan-drivers
  - mesa-utils
  - vulkan-tools
  - xvfb
  - libatomic1
  - libreoffice-writer
  - libreoffice-calc
  - libreoffice-impress
  - libreoffice-draw
  - evince
  - gimp
  - inkscape
  - ristretto
  - imagemagick
  - ffmpeg
  - poppler-utils
  - tesseract-ocr
  - tesseract-ocr-eng
  - tesseract-ocr-deu
  - ocrmypdf
  - pandoc
  - fonts-dejavu
  - fonts-liberation
  - fonts-noto-core
  - fonts-noto-cjk
  - fonts-noto-color-emoji
  - bash-completion
  - tmux
  - git
  - git-lfs
  - jq
  - yq
  - ripgrep
  - fd-find
  - fzf
  - tree
  - less
  - file
  - rsync
  - unzip
  - zip
  - 7zip
  - xz-utils
  - zstd
  - openssh-client
  - build-essential
  - cmake
  - ninja-build
  - pkg-config
  - libssl-dev
  - python3-venv
  - python3-pip
  - python3-tk
  - pipx
  - nodejs
  - npm
  - htop
  - ncdu
  - lsof
  - strace
  - pciutils
  - usbutils
  - dnsutils
  - iproute2
  - restic
