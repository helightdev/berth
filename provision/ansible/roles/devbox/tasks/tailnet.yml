---
# Join the tailnet once, with a one-use key berth made: the one of a seed,
# or, with devbox_tailscale_key_command, one berth makes on the machine that
# runs this play when the host is about to use it. A host on the tailnet
# already is left alone, so applying again needs no key and never logs it out.
- name: Check that the host can join the tailnet
  ansible.builtin.include_tasks: tailnet_check.yml
- name: Create a one-use enrollment key with berth
  ansible.builtin.command:
    argv: "{{ devbox_tailscale_key_command }}"
  delegate_to: localhost
  become: false
  register: devbox_tailscale_made_key
  changed_when: false
  failed_when: false
  no_log: true
  when:
    - not devbox_tailnet_enrolled | bool
    - devbox_tailscale_key_command | length > 0
# Kept out of the task above, which hides its output for the key's sake.
- name: Explain why berth made no enrollment key
  ansible.builtin.fail:
    msg: "berth could not create an enrollment key: {{ devbox_tailscale_made_key.stderr | default('') | trim }}"
  when: devbox_tailscale_made_key.rc | default(0) != 0
- name: Choose the enrollment key
  ansible.builtin.set_fact:
    devbox_tailnet_key: "{{ (devbox_tailscale_made_key.stdout | default('') | trim) if devbox_tailscale_key_command | length > 0 else devbox_tailscale_auth_key }}"
  no_log: true
- name: Enroll Tailscale only when not already enrolled
  when: not devbox_tailnet_enrolled | bool and devbox_tailnet_key | length > 0
  block:
    - name: Store one-time enrollment credential
      ansible.builtin.copy:
        dest: /run/devbox-tailscale-key
        content: "{{ devbox_tailnet_key }}"
        mode: '0600'
      no_log: true
    # The key of a seed lasts a day. A machine first started later is set up
    # without the tailnet, and berth's next apply joins it with a new key.
    - name: Consume enrollment key
      ansible.builtin.command:
        argv: "{{ ['tailscale', 'up', '--timeout=3m', '--auth-key=file:/run/devbox-tailscale-key'] + (['--login-server=' ~ devbox_tailscale_login_server] if devbox_tailscale_login_server | length > 0 else []) }}"
      register: devbox_tailnet_up
      changed_when: devbox_tailnet_up.rc == 0
      failed_when: devbox_tailnet_up.rc != 0 and devbox_tailscale_key_command | length > 0
    - name: Explain why the host is not on the tailnet
      ansible.builtin.debug:
        msg: >-
          The host did not join the tailnet with the key of its seed, which lasts 24 hours
          ({{ devbox_tailnet_up.stderr | default('') | trim }}). It is reached over SSH at its address;
          apply it from berth to join it with a new key.
      when: devbox_tailnet_up.rc != 0
  always:
    - name: Remove temporary enrollment credential
      ansible.builtin.file:
        path: /run/devbox-tailscale-key
        state: absent
