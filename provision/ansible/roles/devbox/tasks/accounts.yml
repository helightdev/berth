---
- name: Configure operator account
  ansible.builtin.user:
    name: "{{ devbox_operator_user }}"
    shell: /bin/bash
    create_home: true
    groups: sudo
    append: true
    password: "{{ devbox_operator_password_hash if devbox_operator_password_hash else omit }}"
  no_log: true
  when: devbox_profile != 'container'
- name: Read the operator's password field
  ansible.builtin.getent:
    database: shadow
    key: "{{ devbox_operator_user }}"
  no_log: true
  when: devbox_profile != 'container' and not devbox_operator_password_hash
# Without PAM, sshd refuses key logins to an account whose password field starts
# with `!`, which is how useradd and cloud-init lock one. `*` allows no password
# either, and sshd takes keys for it with and without PAM.
- name: Lock the operator's password so its keys still log in
  ansible.builtin.user:
    name: "{{ devbox_operator_user }}"
    password: '*'
  no_log: true
  when: >-
    devbox_profile != 'container' and not devbox_operator_password_hash
    and (ansible_facts.getent_shadow[devbox_operator_user][0] | default('')) is match('^(!|$)')
# berth looks after the host as the operator, so sudo never asks it for a password.
- name: Configure operator passwordless administration
  ansible.builtin.copy:
    dest: /etc/sudoers.d/99-devbox-operator
    content: "{{ devbox_operator_user }} ALL=(ALL:ALL) NOPASSWD: ALL\n"
    owner: root
    group: root
    mode: '0440'
    validate: /usr/sbin/visudo -cf %s
  when: devbox_profile != 'container'
- name: Create the agent account
  ansible.builtin.user:
    name: "{{ devbox_user }}"
    home: "{{ devbox_home }}"
    shell: /bin/bash
    create_home: true
    password: "{{ devbox_agent_password_hash if devbox_agent_password_hash else '!' }}"
    password_lock: "{{ not (devbox_agent_password_hash | length > 0) }}"
  no_log: true
# `devbox_agent_privileges` is full, limited or none. A profile from before it
# existed says only whether sudo asks for a password, and keeps that meaning.
- name: Settle what the agent may do as root
  ansible.builtin.set_fact:
    devbox_privileges: "{{ devbox_agent_privileges if devbox_agent_privileges | length > 0 else ('full' if devbox_agent_passwordless_sudo else 'password') }}"
- name: Read agent identity
  ansible.builtin.getent:
    database: passwd
    key: "{{ devbox_user }}"
- name: Set runtime identity
  ansible.builtin.set_fact:
    devbox_uid: "{{ ansible_facts.getent_passwd[devbox_user][1] }}"
    devbox_bind: "{{ '0.0.0.0' if devbox_profile == 'container' else '127.0.0.1' }}"
- name: Create managed root directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /etc/devbox
    - /var/lib/devbox
    - /opt/devbox-tools
    - /srv/agent
- name: Create agent directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ devbox_user }}"
    group: "{{ devbox_user }}"
    mode: '0700'
  loop:
    - "{{ devbox_home }}/.local/bin"
    - "{{ devbox_home }}/.config/tigervnc"
    - "{{ devbox_home }}/.config/systemd/user"
    - "{{ devbox_home }}/.config/autostart"
    - "{{ devbox_home }}/.local/share/applications"
    - "{{ devbox_home }}/.t3"
    - "{{ devbox_home }}/.claude"
    - "{{ devbox_home }}/.codex"
    - "{{ devbox_home }}/.pi/agent"
    - "{{ devbox_home }}/.config/mise"
    - "{{ devbox_home }}/Desktop"
    - "{{ devbox_home }}/Downloads"
    - /srv/agent/workspaces
    - /srv/agent/artifacts
    - /srv/agent/shared
- name: Add tool paths to interactive shells
  ansible.builtin.copy:
    dest: /etc/profile.d/devbox.sh
    mode: '0644'
    content: |
      if [ "$(id -un)" = "{{ devbox_user }}" ]; then
        export PATH="{{ devbox_tool_path }}:$PATH"
        if [ -r "$HOME/.config/devbox/secrets.env" ]; then . "$HOME/.config/devbox/secrets.env"; fi
      fi
      export DISABLE_AUTOUPDATER=1
- name: Add tool paths to non-login interactive agent shells
  ansible.builtin.blockinfile:
    path: "{{ devbox_home }}/.bashrc"
    create: true
    owner: "{{ devbox_user }}"
    group: "{{ devbox_user }}"
    mode: '0644'
    marker: '# {mark} DEVBOX TOOLS'
    block: |
      export PATH="{{ devbox_tool_path }}:$PATH"
      export DISABLE_AUTOUPDATER=1
      if [ -r "$HOME/.config/devbox/secrets.env" ]; then . "$HOME/.config/devbox/secrets.env"; fi
- name: Provide fd command
  ansible.builtin.file:
    src: /usr/bin/fdfind
    dest: /usr/local/bin/fd
    state: link
- name: Manage account SSH access
  vars:
    devbox_ssh_accounts: >-
      {{ [{'user': devbox_user, 'key': devbox_agent_ssh_public_key, 'berth': ''}]
         + ([] if devbox_profile == 'container' else
            [{'user': devbox_operator_user, 'key': devbox_operator_ssh_public_key,
              'berth': devbox_berth_ssh_public_key}]) }}
  block:
    - name: Create account SSH directories
      ansible.builtin.file:
        path: "/home/{{ item.user }}/.ssh"
        state: directory
        owner: "{{ item.user }}"
        group: "{{ item.user }}"
        mode: '0700'
      loop: "{{ devbox_ssh_accounts }}"
      loop_control:
        label: "{{ item.user }}"
      when: (item.key ~ item.berth) | length > 0
    - name: Check existing authorized keys
      ansible.builtin.stat:
        path: "/home/{{ item.user }}/.ssh/authorized_keys"
      loop: "{{ devbox_ssh_accounts }}"
      loop_control:
        label: "{{ item.user }}"
      register: devbox_authorized_keys
    # Each berth that applies this keeps its key in a block of its own, which no
    # later apply removes, so a change to the profile's keys never locks it out.
    - name: Give the operator the key of the berth that applies this
      ansible.builtin.blockinfile:
        path: "/home/{{ devbox_operator_user }}/.ssh/authorized_keys"
        create: true
        owner: "{{ devbox_operator_user }}"
        group: "{{ devbox_operator_user }}"
        mode: '0600'
        marker: "# {mark} BERTH {{ devbox_berth_ssh_public_key.split()[1] | hash('sha1') }}"
        block: "{{ devbox_berth_ssh_public_key }}"
      when: devbox_profile != 'container' and devbox_berth_ssh_public_key | length > 0
    - name: Configure account authorized public keys
      ansible.builtin.blockinfile:
        path: "/home/{{ item.item.user }}/.ssh/authorized_keys"
        create: true
        state: "{{ 'present' if item.item.key | length > 0 else 'absent' }}"
        owner: "{{ item.item.user }}"
        group: "{{ item.item.user }}"
        mode: '0600'
        marker: '# {mark} DEVBOX'
        block: "{{ item.item.key }}"
      loop: "{{ devbox_authorized_keys.results }}"
      loop_control:
        label: "{{ item.item.user }}"
      when: item.item.key | length > 0 or item.stat.exists
    - name: Check that the operator takes the key of the berth that applies this
      ansible.builtin.command:
        argv: [grep, -qxF, --, "{{ devbox_berth_ssh_public_key }}", "/home/{{ devbox_operator_user }}/.ssh/authorized_keys"]
      changed_when: false
      when: devbox_profile != 'container' and devbox_berth_ssh_public_key | length > 0
