---
- name: Check target and profile before any changes
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == 'Ubuntu'
      - ansible_facts.distribution_version == '26.04'
      - ansible_facts.architecture == 'x86_64'
      - devbox_profile in ['laptop', 'cloud', 'container']
      - devbox_user is match('^[a-z_][a-z0-9_-]{0,31}$')
      - devbox_home == '/home/' ~ devbox_user
      - devbox_operator_user is match('^[a-z_][a-z0-9_-]{0,31}$')
      - devbox_operator_user != devbox_user
      - devbox_user not in devbox_reserved_names
      - devbox_operator_user not in devbox_reserved_names
      - devbox_agent_privileges in ['', 'full', 'limited', 'none']
      - devbox_agent_privileges | length > 0 or devbox_agent_passwordless_sudo or devbox_agent_password_hash | length > 0
      - devbox_agent_password_hash == '' or devbox_agent_password_hash is match('^\$[6y]\$')
      - devbox_operator_password_hash == '' or devbox_operator_password_hash is match('^\$[6y]\$')
      - devbox_berth_ssh_public_key.splitlines() | reject('match', '^(ssh-|ecdsa-|sk-)[^ ]+ [A-Za-z0-9+/=]+( .*)?$') | list | length == 0
      - devbox_geometry is match('^[0-9]{3,4}x[0-9]{3,4}$')
    fail_msg: This version supports dedicated Ubuntu 26.04 amd64 hosts with distinct operator and agent accounts whose names Ubuntu does not already use.
- name: Install common packages
  ansible.builtin.apt:
    name: "{{ devbox_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 300
  environment:
    DEBIAN_FRONTEND: noninteractive
- name: Configure accounts and paths
  ansible.builtin.import_tasks: accounts.yml
- name: Install application runtimes
  ansible.builtin.import_tasks: toolchains.yml
- name: Install desktop applications and coding clients
  ansible.builtin.import_tasks: applications.yml
- name: Apply selected plugins
  ansible.builtin.import_tasks: plugins.yml
- name: Configure the shared desktop
  ansible.builtin.import_tasks: desktop.yml
- name: Install berthd, box and what they read
  ansible.builtin.import_tasks: berth.yml
- name: Configure full host services
  ansible.builtin.include_tasks: host.yml
  when: devbox_profile != 'container'
- name: Configure laptop integration
  ansible.builtin.include_tasks: laptop.yml
  when: devbox_profile == 'laptop'
- name: Record provisioned configuration (authentication is separate)
  ansible.builtin.copy:
    dest: /var/lib/devbox/status.json
    mode: '0644'
    content: "{{ {'state': 'configured-needs-enrollment', 'profile': devbox_profile, 'agents_installed': devbox_install_agents, 't3': devbox_t3_version, 'claude': devbox_claude_version, 'codex': devbox_codex_version, 'pi': devbox_pi_version, 'tool_categories': devbox_enabled_categories, 'plugin_features': devbox_plugin_features, 'agent_privileges': devbox_privileges, 'software_rendering': devbox_software_rendering, 'cockpit': devbox_install_cockpit and devbox_profile != 'container', 'ssh_hardened': devbox_ssh_hardened | default(false)} | to_nice_json }}\n"
# Last, so a run that failed leaves the host recorded as it was before.
- name: Record what this configuration came from
  ansible.builtin.import_tasks: applied.yml
