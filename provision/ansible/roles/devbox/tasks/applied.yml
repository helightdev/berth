---
# Which berth and plugins this configuration came from, for berthd to report:
# berth compares it with what it would apply now to tell whether the host is
# behind. Only the plugins whose features the host has are recorded. A host
# with the controller alone says so; a whole profile is recorded as before.
- name: Record which berth and plugins this configuration came from
  ansible.builtin.copy:
    dest: /etc/berth/applied.json
    mode: '0644'
    content: "{{ ({'berth': devbox_berth_applied.berth, 'plugins': devbox_berth_applied.plugins | selectattr('id', 'in', devbox_plugin_features | map('regex_replace', '/.*$', '') | list) | list} | combine({'level': devbox_level} if devbox_level != 'workstation' else {})) | to_nice_json }}\n"
  when: devbox_berth_applied is defined
