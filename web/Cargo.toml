[package]
name = "berth-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "berth in a browser: the hosts of a berth serve, drawn by ratzilla"

# Only a browser runs it; berth's own build makes the wasm and carries it.
[[bin]]
name = "berth-web"
path = "src/main.rs"

[target.'cfg(target_arch = "wasm32")'.dependencies]
berth-api = { workspace = true, default-features = false }
berth-tui.workspace = true
serde_json.workspace = true
tui-input = { path = "../cli/vendor/tui-input", default-features = false }
web-time = "1"
ratzilla = "0.3.1"
wasm-bindgen = "=0.2.129"
js-sys = "0.3"
console_error_panic_hook = "0.1"
# ratatui locks through critical-section; a page has one thread, and std's lock does.
critical-section = { version = "1", features = ["std"] }
web-sys = { version = "0.3", features = [
    "BinaryType", "Blob", "Clipboard", "ClipboardEvent", "CloseEvent", "DataTransfer", "Document", "DomRect",
    "Element", "Event", "EventTarget", "File", "FileList", "History", "HtmlElement", "HtmlInputElement",
    "KeyboardEvent", "Location",
    "MessageEvent", "MouseEvent", "Navigator", "ResizeObserver", "Storage", "WebSocket", "WheelEvent",
    "Window",
] }
